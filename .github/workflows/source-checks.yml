name: Source layout checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check repository paths and Python syntax (not a native build)
        run: python -m unittest discover -s tests -v
      - name: Check native build shell syntax
        run: bash -n PocketFrameNative/tools/build-linux-arm64.sh PocketFrameNative/tools/setup-ubuntu.sh
