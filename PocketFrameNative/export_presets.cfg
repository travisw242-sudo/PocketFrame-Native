[preset.0]
name="Steam Frame ARM64"
platform="Linux"
runnable=true
advanced_options=true
dedicated_server=false
custom_features="steam_frame_native"
export_filter="resources"
export_files=PackedStringArray("res://native_boot.tscn", "res://main.tscn", "res://icon.svg", "res://bin/PocketFrameAzahar.gdextension", "res://openxr_action_map.tres", "res://assets/vendor/xr_hands/Hand_Nails_L.gltf", "res://assets/vendor/xr_hands/Hand_Nails_R.gltf", "res://assets/vendor/xr_hands/Grip.res", "res://assets/vendor/xr_hands/Grip 5.res", "res://assets/vendor/xr_hands/Pinch Tight.res", "res://assets/vendor/xr_hands/caucasian_realistic_baseColor.png", "res://assets/vendor/xr_hands/hands_normal.png", "res://assets/shells/nebula.png", "res://assets/shells/botanical.png")
include_filter="scripts/*.gd,scripts/*.gdshader,scripts/*.gdshaderinc,icon.svg"
exclude_filter="games/*,runtime/*,native/*,tools/*,tests/*,docs/*,scripts/launcher.gd,scripts/bedroom.gd,*.log,*.cci,*.3ds,*.cia,*.cxi,*.3dsx,*.app,*.sav,*.zip,*.pdb"
export_path="../outputs/native-steamframe/PocketFrameNative.arm64"
encrypt_pck=false
encrypt_directory=false

[preset.0.options]
custom_template/debug=""
custom_template/release="res://../work/native-export-runtime/linux_release.arm64"
binary_format/architecture="arm64"
binary_format/embed_pck=false
texture_format/s3tc_bptc=false
texture_format/etc2_astc=true
debug/export_console_wrapper=0
